# golangci-lint configuration (v2 schema), modelled on lolay/triage.
#
# `make lint` runs this and fails when golangci-lint is missing; CI always
# runs it. Linters: the v2 "standard" set (errcheck, govet, ineffassign,
# staticcheck, unused) plus misspell and errorlint, with gofmt and goimports
# as formatters.
#
# triage's wider set reported 29 findings on the ported code, past the
# point where fixing them all belongs in a baseline change, so these
# linters are left out for now. Re-enable one by one in follow-up work:
#   - gosec: G301/G304/G306 flag 0o755/0o644 modes and variable paths that
#     are intended for a tool that writes a user's checkout tree; G204 flags
#     the git exec sites, which are by design.
#   - govet enable-all (fieldalignment, shadow): struct-layout and shadow
#     nits with no behavioural effect on a CLI this size.
#   - modernize: five idiom upgrades (max, WaitGroup.Go, CutPrefix,
#     errors.AsType); safe, queued for a dedicated pass.
#   - revive: exported-comment rules for the Action and Source constants.
#   - bodyclose: no findings, left out only to match the smaller set.
version: "2"

linters:
  default: standard
  enable:
    - misspell
    - errorlint

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/lolay/ghx
